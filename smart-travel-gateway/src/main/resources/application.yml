server:
  port: 8080

spring:
  application:
    name: smart-travel
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://192.168.88.100:3306/smart_travel?serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: root
    password: 123456

  rabbitmq:
    host: localhost
    port: 5672
    username: smart-travel
    password: 123456
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

  data:
    redis:
      host: localhost
      port: 6379
      password: "123456"
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  type-aliases-package: com.smarttravel.common.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.smarttravel: debug

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: smart-travel-jwt-secret-key-2026
  expiration: 3600000

aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: smart-travel-bucket

amap:
  key: ${AMAP_KEY}